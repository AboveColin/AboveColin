name: Star history

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/stars.py
      - .github/workflows/stars.yml

permissions:
  contents: write

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Snapshot mode only. Listing the stargazers of another repository needs a
      # token with wider reach than the Actions GITHUB_TOKEN, which is scoped to
      # this repository, so the full history is rebuilt from a laptop with
      # scripts/stars.py --backfill. Reading the current counts per repository
      # needs no such reach.
      #
      # Regenerating inside the retry loop, rather than rebasing the commit,
      # keeps a run that lost the race from replaying stale generated files.
      - name: Render the star history and commit any change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 scripts/stars.py
            if [ -z "$(git status --porcelain)" ]; then
              echo "nothing moved"
              exit 0
            fi
            git add README.md data/stars.json assets/stars-light.svg assets/stars-dark.svg
            git commit --quiet -m "stars: refresh the series"
            if git push --quiet; then
              exit 0
            fi
            echo "push rejected on attempt $attempt, regenerating"
            sleep 5
          done
          echo "three pushes rejected in a row"
          exit 1
